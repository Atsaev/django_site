{% extends "base.html" %}
{% block title %}{{ post.title }} — atsaev-dev.ru{% endblock %}

{% block content %}
<article class="container py-5" style="max-width: 760px;">
  <div class="mono text-muted mb-2" style="font-size:0.8rem;">{{ post.published_at|date:"d M Y" }} · {{ post.views }} views</div>
  <h1 class="mb-4">{{ post.title }}</h1>
  <div class="post-content">{{ post.content|safe }}</div>
</article>
{% endblock %}

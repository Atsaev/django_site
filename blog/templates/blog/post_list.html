{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Блог - atsaev-dev.ru</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body>
    <section class="container py-5">
        <div class="section-eyebrow mb-2">// последние посты</div>
        <div class="row justify-content-center mt-1">
            <div class="col-lg-9">
                {% for post in posts %}
                <a href="{% url 'post_detail' post.slug %}" class="post-row">
                    <div>
                        <div class="post-title mb-1">{{ post.title }}</div>
                        <div class="d-flex gap-2">
                            {% for tag in post.tag_list %}
                            <span class="badge-tag badge">{{ tag }}</span>
                            {% endfor %}
                        </div>
                    </div>
                    <span class="post-date">{{ post.published_at|date:"d M" }}</span>
                </a>
                {% empty %}
                    <p class="text-muted">Постов пока нет.</p>
                {% endfor %}
            </div>
        </div>
    </section>
</body>
</html>

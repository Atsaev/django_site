[project]
name = "django-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-ckeditor-5>=0.2.20",
    "django-imagekit>=6.1.0",
    "granian>=2.8.2",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "weasyprint>=62.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.1.1",
    "django-stubs>=6.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Базовый набор (как в большинстве Django-проектов).
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# RUF012 (мутабельные дефолты атрибутов класса) шумит на идиоматичных Django-конструкциях
# (ordering в Meta, prepopulated_fields в ModelAdmin, dependencies/operations в миграциях) —
# это декларативные данные, а не классовые переменные.
# RUF001-RUF003 (неоднозначные символы) неприменимы в русскоязычном проекте.
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Миграции — генерируемый Django-код, трогать стиль не нужно.
"blog/migrations/*" = ["DTZ", "E501"]
"resume/migrations/*" = ["DTZ", "E501"]
"portfolio/migrations/*" = ["DTZ", "E501"]
"config/migrations/*" = ["DTZ", "E501"]
# Seed-описания проектов — длинные маркетинговые тексты, переносы не улучшают.
"portfolio/management/commands/seed_projects.py" = ["E501"]
